services:
  asra3-saas:
    container_name: asra3-zernio-saas
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://asra3.com}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Asra3}
        NEXT_PUBLIC_BRAND_PRIMARY_COLOR: ${NEXT_PUBLIC_BRAND_PRIMARY_COLOR:-#4F46E5}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL:-https://asra3.com/logo.png}
    ports:
      - "127.0.0.1:${PORT:-3008}:3008"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3008
      - HOSTNAME=0.0.0.0
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
