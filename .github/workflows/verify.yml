name: Verify launch
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g postman-cli@1.73.0
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:launch
      - run: npm run test:regression
      - name: Billing pricing, enrollment, browser and worker checks
        run: npm run test:billing
      - run: npm run test:launch:database
      - name: Billing concurrency, access and service integration checks
        run: npm run test:billing:database
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://asra3.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      - run: node scripts/tests/phase1a-http-smoke.mjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: >-
          docker build --tag asra3-launch-check:ci
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-placeholder
          --build-arg NEXT_PUBLIC_APP_URL=https://asra3.com .
      - run: node scripts/tests/launch-docker-smoke.mjs
        env:
          ASRA3_TEST_IMAGE: asra3-launch-check:ci
